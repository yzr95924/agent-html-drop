<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>agent-html-drop 管理</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <h1>agent-html-drop 管理 <small id="version-tag" class="version-tag" title="daemon 版本">…</small></h1>
    <div id="readonly-note" class="hint">
      只读浏览 · 删除 / 上传请走 agent MCP（参见 README）
    </div>
    <button id="anno-toggle" type="button" aria-label="进入批注模式">批注(需 token)</button>
    <span id="anno-mode-hint" class="hint" hidden>批注模式 · <a href="#" id="anno-exit">退出</a></span>
  </header>

  <dialog id="anno-token-dialog" aria-labelledby="anno-token-title">
    <form method="dialog" id="anno-token-form">
      <h2 id="anno-token-title">进入批注模式</h2>
      <p>粘贴 agent-html-drop token(在 server 端跑 <code>agent-html-drop token show</code> 获取)</p>
      <input id="anno-token-input" type="password" autocomplete="off" />
      <menu>
        <button type="button" id="anno-token-cancel">取消</button>
        <button type="submit" id="anno-token-submit">进入</button>
      </menu>
      <p id="anno-token-error" class="error" hidden></p>
    </form>
  </dialog>

  <dialog id="anno-add-dialog" aria-labelledby="anno-add-title">
    <form method="dialog" id="anno-add-form">
      <h2 id="anno-add-title">添加批注</h2>
      <blockquote id="anno-add-quote"></blockquote>
      <p id="anno-add-truncated" class="hint" hidden>选中内容过长,已截断为前 200 字符</p>
      <textarea id="anno-add-comment" rows="4" maxlength="2000"
        placeholder="写下你的批注…"></textarea>
      <menu>
        <button type="button" id="anno-add-cancel">取消</button>
        <button type="submit" id="anno-add-submit">提交</button>
      </menu>
      <p id="anno-add-error" class="error" hidden></p>
    </form>
  </dialog>

  <main>
    <section id="files-section">
      <h2>文件</h2>
      <div id="empty-state" hidden>暂无文件 —— 调 MCP <code>upload_html</code> 上传第一篇。</div>
      <div id="load-error" hidden></div>
      <table id="file-table">
        <thead>
          <tr>
            <th>名称</th>
            <th>大小</th>
            <th>时间</th>
            <th>批注</th>
          </tr>
        </thead>
        <tbody id="file-tbody"></tbody>
      </table>
    </section>

    <section id="preview-section" hidden>
      <div class="preview-head">
        <h2>预览 <span id="preview-name"></span></h2>
        <button id="toc-toggle" type="button" aria-pressed="false" title="显示/隐藏目录侧栏">大纲</button>
      </div>
      <iframe id="preview-frame" sandbox="allow-same-origin" title="preview"></iframe>
    </section>
  </main>

  <aside id="anno-sidebar" aria-label="批注" class="collapsed">
    <header>
      <div class="sidebar-actions">
        <button id="anno-sidebar-refresh" type="button" aria-label="刷新">↻</button>
        <button id="anno-collapse" type="button" aria-label="收起批注栏" title="收起">›</button>
      </div>
    </header>
    <ul id="anno-list"></ul>
    <p id="anno-empty" hidden>暂无批注</p>
  </aside>

  <button id="anno-opener" type="button" aria-label="展开批注栏" title="展开批注栏" hidden>批注 ‹</button>

  <div id="toast" hidden></div>

  <button id="anno-add-fab" type="button" hidden>＋ 批注</button>

  <!-- click a highlight to read its comment in place (sidebar stays folded) -->
  <div id="anno-popover" hidden role="dialog" aria-label="批注">
    <button id="anno-popover-close" type="button" aria-label="关闭">×</button>
    <div id="anno-popover-quote" class="ap-quote"></div>
    <div id="anno-popover-comment" class="ap-comment"></div>
    <div id="anno-popover-meta" class="ap-meta"></div>
    <div class="ap-nav">
      <button id="anno-popover-prev" type="button" aria-label="上一个批注">‹</button>
      <span id="anno-popover-counter" class="ap-counter">1 / 1</span>
      <button id="anno-popover-next" type="button" aria-label="下一个批注">›</button>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
